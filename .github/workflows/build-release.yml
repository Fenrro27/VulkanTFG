name: Build multi-SO

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: /tmp/vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de sistema
        run: |
          set -ex
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build glslang-tools \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxext-dev libwayland-dev wayland-protocols libxkbcommon-dev libxcb1-dev libgl-dev libegl1-mesa-dev

      - name: Clonar y bootstrapar vcpkg
        run: |
          set +e
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT" 2>&1 | tee /tmp/vcpkg.log
          rc1="${PIPESTATUS[0]}"
          if [ "$rc1" -eq 0 ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics 2>&1 | tee -a /tmp/vcpkg.log
            rc1="${PIPESTATUS[0]}"
          fi
          if [ "$rc1" -ne 0 ]; then
            tail -n 30 /tmp/vcpkg.log | while IFS= read -r l; do echo "::error>VCPKG>$l"; done
          fi
          exit "$rc1"

      - name: Configurar (linux-release)
        run: |
          set +e
          cmake --preset linux-release 2>&1 | tee /tmp/config.log
          rc="${PIPESTATUS[0]}"
          if [ "$rc" -ne 0 ]; then
            grep -nE "error:|fatal error:|ninja: build stopped|FAILED|undefined reference" /tmp/config.log > /tmp/errl.log || tail -n 80 /tmp/config.log > /tmp/errl.log
            tail -n 25 /tmp/errl.log | while IFS= read -r l; do echo "::error::CI>$l"; done
          fi
          exit "$rc"

      - name: Compilar
        run: cmake --build --preset linux-release

      - name: Subir log de configuracion si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-linux-config
          path: /tmp/config.log

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectTFG-linux
          path: |
            out/build/linux-release/bin/ProjectTFG
            out/build/linux-release/bin/shaders
            out/build/linux-release/bin/textures
            out/build/linux-release/bin/models

      - name: Preparar binario
        run: mkdir -p "$RUNNER_TEMP/release" && cp out/build/linux-release/bin/ProjectTFG "$RUNNER_TEMP/release/ProjectTFG-linux.elf"

      - name: Adjuntar a Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/release/ProjectTFG-linux.elf
          fail_on_unmatched_files: true


  windows:
    name: Windows
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vt\vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Vulkan SDK (glslang/glslc)
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdk = Get-ChildItem "C:\VulkanSDK" -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
          if ($sdk) { "$($sdk.FullName)\Bin" | Out-File -Append $env:GITHUB_PATH -Encoding UTF8 }
          else { Write-Error "VulkanSDK no encontrado tras instalar con choco" }

      - name: Clonar y bootstrapar vcpkg
        run: |
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_ROOT" | Out-Null
          git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configurar (win-release)
        run: |
          cmake --preset win-release 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\config.log"
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path "$env:RUNNER_TEMP\config.log" -Pattern "error|fatal|FAILED|stopped" | Select-Object -Last 15 | ForEach-Object { Write-Output "::error>WIN>$($_.Line)" }
            Get-Content "$env:RUNNER_TEMP\config.log" -Tail 15 | ForEach-Object { Write-Output "::error>WIN>$_" }
          }
          exit $LASTEXITCODE

      - name: Compilar
        run: cmake --build --preset win-release --config Release

      - name: Subir log de configuracion si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-windows-config
          path: ${{ runner.temp }}\config.log

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectTFG-windows
          path: |
            out/build/win-release/bin/ProjectTFG.exe
            out/build/win-release/bin/shaders
            out/build/win-release/bin/textures
            out/build/win-release/bin/models

      - name: Preparar binario
        run: mkdir -p "$env:RUNNER_TEMP\release" && Copy-Item out/build/win-release/bin/ProjectTFG.exe "$env:RUNNER_TEMP\release\ProjectTFG-windows.exe"

      - name: Adjuntar a Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/release/ProjectTFG-windows.exe
          fail_on_unmatched_files: true

  macos:
    name: macOS
    runs-on: macos-latest
    env:
      VCPKG_ROOT: /tmp/vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias (Homebrew)
        run: |
          set -ex
          brew install ninja glslang shaderc

      - name: Clonar y bootstrapar vcpkg
        run: |
          set +e
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT" 2>&1 | tee /tmp/vcpkg.log
          rc1="${PIPESTATUS[0]}"
          if [ "$rc1" -eq 0 ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics 2>&1 | tee -a /tmp/vcpkg.log
            rc1="${PIPESTATUS[0]}"
          fi
          if [ "$rc1" -ne 0 ]; then
            tail -n 30 /tmp/vcpkg.log | while IFS= read -r l; do echo "::error>VCPKG>$l"; done
          fi
          exit "$rc1"


      - name: Configurar (macos-release)
        run: cmake --preset macos-release

      - name: Compilar
        run: cmake --build --preset macos-release

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectTFG-macos
          path: |
            out/build/macos-release/bin/ProjectTFG
            out/build/macos-release/bin/shaders
            out/build/macos-release/bin/textures
            out/build/macos-release/bin/models

      - name: Empaquetar como .app
        run: |
          set -ex
          APP="$RUNNER_TEMP/ProjectTFG.app/Contents"
          mkdir -p "$APP/MacOS"
          cp out/build/macos-release/bin/ProjectTFG "$APP/MacOS/ProjectTFG"
          cp ProjectTFG/macos/Info.plist "$APP/Info.plist"
          mkdir -p "$RUNNER_TEMP/release"
          (cd "$RUNNER_TEMP" && zip -r -y "release/ProjectTFG-macos.app.zip" ProjectTFG.app)

      - name: Adjuntar a Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/release/ProjectTFG-macos.app.zip
          fail_on_unmatched_files: true

  memoria:
    name: Memoria (LaTeX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar TeX Live
        run: |
          set -ex
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-pictures texlive-bibtex-extra \
            texlive-lang-spanish biber

      - name: Compilar memoria (pdflatex + biber)
        working-directory: Memoria
        run: |
          set +e
          rm -f memoria.aux memoria.bcf memoria.bbl memoria.bbl-SAVE-ERROR memoria.run.xml memoria.log
          pdflatex -interaction=nonstopmode -halt-on-error memoria.tex > /tmp/tex1.log 2>&1
          r1=$?
          biber memoria > /tmp/biber.log 2>&1
          rb=$?
          pdflatex -interaction=nonstopmode -halt-on-error memoria.tex > /tmp/tex2.log 2>&1
          r2=$?
          pdflatex -interaction=nonstopmode -halt-on-error memoria.tex > /tmp/tex3.log 2>&1
          r3=$?
          cat /tmp/tex1.log /tmp/biber.log /tmp/tex2.log /tmp/tex3.log > /tmp/tex-all.log
          if [ "$r1" -ne 0 ] || [ "$rb" -ne 0 ] || [ "$r2" -ne 0 ] || [ "$r3" -ne 0 ]; then
            grep -nE "error:|Error|Fatal|!" /tmp/tex-all.log > /tmp/tex-err.log || tail -n 60 /tmp/tex-all.log > /tmp/tex-err.log
            tail -n 25 /tmp/tex-err.log | while IFS= read -r l; do echo "::error>MEM>$l"; done
            exit 1
          fi
          ls -la memoria.pdf

      - name: Subir log de Latex si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-memoria
          path: |
            /tmp/tex-all.log
            /tmp/biber.log

      - name: Subir PDF
        uses: actions/upload-artifact@v4
        with:
          name: memoria-pdf
          path: Memoria/memoria.pdf
          if-no-files-found: error

      - name: Adjuntar a Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Memoria/memoria.pdf
          fail_on_unmatched_files: false