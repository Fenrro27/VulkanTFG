name: Build multi-SO

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-debian:
    name: Linux (Debian/Ubuntu)
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ runner.temp }}/vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build glslang-tools \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxext-dev libwayland-dev libwayland-protocols libxkbcommon-dev libxcb1-dev

      - name: Clonar y bootstrapar vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configurar (linux-release)
        run: cmake --preset linux-release

      - name: Compilar
        run: cmake --build --preset linux-release

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectTFG-linux-debian
          path: |
            out/build/linux-release/bin/ProjectTFG
            out/build/linux-release/bin/shaders
            out/build/linux-release/bin/textures
            out/build/linux-release/bin/models

      - name: Adjuntar a Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/build/linux-release/bin/ProjectTFG
            out/build/linux-release/bin/shaders
            out/build/linux-release/bin/textures
            out/build/linux-release/bin/models
          fail_on_unmatched_files: false

  linux-arch:
    name: Linux (Arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar (contenedor Arch)
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" -w "${GITHUB_WORKSPACE}" archlinux bash -lc '
            set -e
            pacman -Syu --noconfirm --needed base-devel git cmake ninja \
              glslang shaderc curl unzip tar \
              libx11 libxrandr libxinerama libxcursor libxi libxext \
              libwayland libxkbcommon wayland-protocols libxcb

            export VCPKG_ROOT="$HOME/vcpkg"
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

            cmake --preset linux-release
            cmake --build --preset linux-release
          '

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectTFG-linux-arch
          path: |
            out/build/linux-release/bin/ProjectTFG
            out/build/linux-release/bin/shaders
            out/build/linux-release/bin/textures
            out/build/linux-release/bin/models

      - name: Adjuntar a Release v*
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/build/linux-release/bin/ProjectTFG
            out/build/linux-release/bin/shaders
            out/build/linux-release/bin/textures
            out/build/linux-release/bin/models
          fail_on_unmatched_files: false

  windows:
    name: Windows
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ runner.temp }}\vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Vulkan SDK y glslang
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdk = Get-ChildItem "C:\VulkanSDK" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if ($sdk) { "$($sdk.FullName)\Bin" | Out-File -Append $env:GITHUB_PATH -Encoding UTF8 }

      - name: Clonar y bootstrapar vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configurar (win-release)
        run: cmake --preset win-release

      - name: Compilar
        run: cmake --build --preset win-release --config Release

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectTFG-windows
          path: |
            out/build/win-release/bin/ProjectTFG.exe
            out/build/win-release/bin/shaders
            out/build/win-release/bin/textures
            out/build/win-release/bin/models

      - name: Adjuntar a Release v*
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/build/win-release/bin/ProjectTFG.exe
            out/build/win-release/bin/shaders
            out/build/win-release/bin/textures
            out/build/win-release/bin/models
          fail_on_unmatched_files: false

  macos:
    name: macOS
    runs-on: macos-latest
    env:
      VCPKG_ROOT: ${{ runner.temp }}/vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias (Homebrew)
        run: |
          brew install ninja glslang shaderc

      - name: Clonar y bootstrapar vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configurar (macos-release)
        run: cmake --preset macos-release

      - name: Compilar
        run: cmake --build --preset macos-release

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectTFG-macos
          path: |
            out/build/macos-release/bin/ProjectTFG
            out/build/macos-release/bin/shaders
            out/build/macos-release/bin/textures
            out/build/macos-release/bin/models

      - name: Adjuntar a Release v*
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/build/macos-release/bin/ProjectTFG
            out/build/macos-release/bin/shaders
            out/build/macos-release/bin/textures
            out/build/macos-release/bin/models
          fail_on_unmatched_files: false