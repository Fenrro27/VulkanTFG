name: Build multi-SO

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux (AppImage)
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    env:
      VCPKG_ROOT: /tmp/vcpkg
    steps:
      - name: Preparar herramientas base
        run: |
          set -ex
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y git curl zip unzip tar ca-certificates python3-pip
          python3 -m pip install --upgrade pip cmake ninja

      - uses: actions/checkout@v4

      - name: Dependencias de sistema
        run: |
          set -ex
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y \
            pkg-config build-essential \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxext-dev libwayland-dev wayland-protocols libxkbcommon-dev libxcb1-dev \
            libgl-dev libegl1-mesa-dev mesa-vulkan-drivers \
            xvfb file

      - name: glslang moderno (SDK LunarG)
        run: |
          set -ex
          # shellcheck disable=SC2086,SC2016
          curl -sL -o /tmp/sdk.tar.xz \
            https://sdk.lunarg.com/sdk/download/1.4.309.0/linux/vulkansdk-linux-x86_64-1.4.309.0.tar.xz
          tar -xJf /tmp/sdk.tar.xz -C /opt
          if ! /opt/vulkansdk/1.4.309.0/x86_64/bin/glslangValidator --version >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get install -y glslang-tools
          else
            echo "/opt/vulkansdk/1.4.309.0/x86_64/bin" >> "$GITHUB_PATH"
          fi

      - name: Clonar y bootstrapar vcpkg
        run: |
          set -ex
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configurar y compilar
        run: |
          set -ex
          cmake --preset linux-release
          cmake --build --preset linux-release

      - name: Preparar AppDir
        run: |
          set -ex
          # shellcheck disable=SC2086,SC2016
          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/bin/vulkan
          cp -r out/build/linux-release/bin/ProjectTFG AppDir/usr/bin/
          cp out/build/linux-release/bin/imgui.ini AppDir/usr/bin/ 2>/dev/null || true
          # Driver por software (lavapipe) empaquetado
          # En usr/lib para que el loader lo encuentre via LD_LIBRARY_PATH,
          # y junto al json ICD para los loaders que resuelven relativo al json.
          cp /usr/lib/x86_64-linux-gnu/libvulkan_lvp.so AppDir/usr/lib/
          cp /usr/lib/x86_64-linux-gnu/libvulkan_lvp.so AppDir/usr/bin/vulkan/
          cp /usr/share/vulkan/icd.d/lvp_icd.x86_64.json AppDir/usr/bin/vulkan/lvp_icd.x86_64.json
          sed -i 's|"library_path".*|"library_path": "libvulkan_lvp.so",|' AppDir/usr/bin/vulkan/lvp_icd.x86_64.json
          # Dependencias dinamicas del ejecutable y de lavapipe (sin glibc/libstdc++/libgcc)
          cp_ldd() {
            ldd "$1" | awk '/=> \// {print $3}' | while read -r lib; do
              case "$lib" in
                *libc.so*|*libm.so*|*libdl.so*|*libpthread.so*|*librt.so*|*libstdc++*|*libgcc_s*|*ld-linux*|*linux-vdso*) ;;
                *) cp -Ln "$lib" AppDir/usr/lib/ 2>/dev/null || true ;;
              esac
            done
          }
          cp_ldd out/build/linux-release/bin/ProjectTFG
          cp_ldd /usr/lib/x86_64-linux-gnu/libvulkan_lvp.so
          # Icono de la app (appimagetool exige el icono dentro del AppDir)
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          python3 - <<'PY'
          import struct, zlib

          def png(path, w=256, h=256, rgb=(0x41, 0x6F, 0xFF)):
              raw = b''.join(b'\x00' + bytes(rgb) * w for _ in range(h))
              def chunk(t, d):
                  return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
              with open(path, 'wb') as f:
                  f.write(b'\x89PNG\r\n\x1a\n')
                  f.write(chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)))
                  f.write(chunk(b'IDAT', zlib.compress(raw)))
                  f.write(chunk(b'IEND', b''))
          png('AppDir/usr/share/icons/hicolor/256x256/apps/ProjectTFG.png')
          PY
          cp AppDir/usr/share/icons/hicolor/256x256/apps/ProjectTFG.png AppDir/ProjectTFG.png
          # shellcheck disable=SC2016
          printf '#!/bin/sh\nAPPDIR="$(dirname "$0")"\nexport LD_LIBRARY_PATH="$APPDIR/usr/lib:$APPDIR/usr/bin/vulkan:$LD_LIBRARY_PATH"\ncd "$APPDIR/usr/bin" 2>/dev/null || true\nexec ./ProjectTFG "$@"\n' > AppDir/AppRun
          # Lanzador
          chmod +x AppDir/AppRun
          cat > AppDir/ProjectTFG.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=ProjectTFG
          Exec=ProjectTFG
          Icon=ProjectTFG
          Categories=Game;
          EOF

      - name: Generar AppImage
        run: |
          set -ex
          curl -sL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimagetool AppDir ProjectTFG-linux.AppImage
          chmod +x ProjectTFG-linux.AppImage
          ls -la ProjectTFG-linux.AppImage

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectTFG-linux.AppImage
          path: ProjectTFG-linux.AppImage

      - name: Adjuntar a Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ProjectTFG-linux.AppImage
          fail_on_unmatched_files: true

  macos:
    name: macOS (DMG)
    runs-on: macos-latest
    env:
      VCPKG_ROOT: /tmp/vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias (Homebrew)
        run: |
          set -ex
          brew install ninja glslang shaderc molten-vk

      - name: Clonar y bootstrapar vcpkg
        run: |
          set -ex
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configurar y compilar
        run: |
          set -ex
          cmake --preset macos-release
          cmake --build --preset macos-release

      - name: Empaquetar .app y DMG
        run: |
          set -ex
          # shellcheck disable=SC2010,SC2012,SC2086
          APP=dist/ProjectTFG.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Frameworks" "$APP/Contents/Resources/vulkan/icd.d"
          cp out/build/macos-release/bin/ProjectTFG "$APP/Contents/MacOS/"
          cp "$(brew --prefix molten-vk)/lib/libMoltenVK.dylib" "$APP/Contents/Frameworks/"
          # Nombre EXACTO del dylib de vulkan-loader que el binario busca via @rpath
          LOADER_BASE=$(otool -L "$APP/Contents/MacOS/ProjectTFG" | awk '/@rpath\/libvulkan/ {print $1; exit}' | sed 's|@rpath/||')
          if [ -z "$LOADER_BASE" ]; then
            echo "No se encontro la referencia @rpath/libvulkan en el binario" >&2
            exit 1
          fi
          # dylib REAL de vcpkg_installed (ignora symlinks: find -type f)
          VK_DYLIB=$(find out/build/macos-release/vcpkg_installed/arm64-osx/lib -maxdepth 1 \
            -name 'libvulkan*.dylib' -type f | head -n 1)
          if [ -z "$VK_DYLIB" ]; then
            echo "No hay libvulkan*.dylib real en vcpkg_installed" >&2
            exit 1
          fi
          # Se copia con TODOS los nombres de version que el binario pueda pedir
          cp "$VK_DYLIB" "$APP/Contents/Frameworks/$LOADER_BASE"
          ln -sf "$LOADER_BASE" "$APP/Contents/Frameworks/libvulkan.dylib"
          ln -sf "$LOADER_BASE" "$APP/Contents/Frameworks/libvulkan.1.dylib"
          ln -sf "$LOADER_BASE" "$APP/Contents/Frameworks/libvulkan.1.4.309.dylib"
          install_name_tool -add_rpath @executable_path/../Frameworks "$APP/Contents/MacOS/ProjectTFG"
          cat > "$APP/Contents/Resources/vulkan/icd.d/MoltenVK_icd.json" <<'EOF'
          {
              "file_format_version": "1.0.0",
              "ICD": {
                  "library_path": "../../../Frameworks/libMoltenVK.dylib",
                  "api_version": "1.3.0",
                  "is_portability_driver": true
              }
          }
          EOF
          cp ProjectTFG/macos/Info.plist "$APP/Contents/Info.plist"
          codesign --force --deep -s - "$APP"

      - name: Smoke test de arranque (macOS)
        run: |
          set -ex
          APP="$(pwd)/dist/ProjectTFG.app"
          "$APP/Contents/MacOS/ProjectTFG" > /tmp/smoke.log 2>&1 &
          PID=$!
          sleep 8
          if ! kill -0 "$PID" 2>/dev/null; then
            wait "$PID" || true
            echo "El binario murio al arrancar (dyld/GPU):" >&2
            cat /tmp/smoke.log >&2
            exit 1
          fi
          kill -9 "$PID" 2>/dev/null || true
          grep -q "ImGui inicializado" /tmp/smoke.log || { echo "Smoke: no se inicializo ImGui"; exit 1; }

      - name: Generar DMG
        run: |
          set -ex
          APP=dist/ProjectTFG.app
          hdiutil create -volname ProjectTFG -srcfolder dist -ov -format UDZO ProjectTFG-macos.dmg
          ls -la ProjectTFG-macos.dmg

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectTFG-macos.dmg
          path: ProjectTFG-macos.dmg

      - name: Adjuntar a Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ProjectTFG-macos.dmg
          fail_on_unmatched_files: true

  windows:
    name: Windows (exe unico)
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vt\vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Vulkan SDK (glslang/glslc)
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdk = Get-ChildItem "C:\VulkanSDK" -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
          if ($sdk) { "$($sdk.FullName)\Bin" | Out-File -Append $env:GITHUB_PATH -Encoding UTF8 }
          else { Write-Error "VulkanSDK no encontrado tras instalar con choco" }

      - name: Clonar y bootstrapar vcpkg
        run: |
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_ROOT" | Out-Null
          git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configurar y compilar (estatico)
        run: |
          cmake --preset win-release 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\config.log"
          if ($LASTEXITCODE -ne 0) {
            Get-Content "$env:RUNNER_TEMP\config.log" -Tail 60 | ForEach-Object { Write-Output "::error::$_" }
            exit $LASTEXITCODE
          }
          cmake --build --preset win-release --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Descargar driver Vulkan por software (mesa llvmpipe)
        run: |
          curl.exe -sL -o "$env:RUNNER_TEMP\mesa.7z" `
            https://github.com/pal1000/mesa-dist-win/releases/download/26.1.6/mesa3d-26.1.6-release-msvc.7z
          & "C:\Program Files\7-Zip\7z.exe" x "$env:RUNNER_TEMP\mesa.7z" -o"$env:RUNNER_TEMP\mesa" -y | Out-Null
          $json = Get-ChildItem "$env:RUNNER_TEMP\mesa" -Recurse -Filter *.json |
            Where-Object { (Get-Content $_.FullName -Raw) -match 'lvp|llvmpipe|swiftshader' } |
            Select-Object -First 1
          if (-not $json) { Write-Error "No se encontro el ICD json de mesa"; exit 1 }
          $dll = Select-String -Path $json.FullName -Pattern '"library_path"\s*:\s*"([^"]+)"' |
            ForEach-Object { $_.Matches[0].Groups[1].Value } | Select-Object -First 1
          $dllFile = Get-ChildItem $json.Directory -Recurse -Filter (Split-Path $dll -Leaf) | Select-Object -First 1
          if (-not $dllFile) { Write-Error "No se encontro la dll del ICD: $dll"; exit 1 }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\stage\vulkan" | Out-Null
          Copy-Item $json.FullName "$env:RUNNER_TEMP\stage\vulkan\vk_swiftshader_icd.json"
          Copy-Item $dllFile.FullName "$env:RUNNER_TEMP\stage\vulkan\$($dllFile.Name)"
          Write-Output "dll ICD: $($dllFile.Name)"

      - name: Incrustar todo en un solo .exe
        run: |
          $exe = "out\build\win-release\bin\ProjectTFG.exe"
          if (-not (Test-Path $exe)) { Write-Error "No existe $exe"; exit 1 }
          $bin = "out\build\win-release\bin"
          $entries = @()
          Get-ChildItem "$bin\shaders" -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
            $rel = $_.FullName.Substring($bin.Length + 1) -replace '\\', '/'
            $entries += @("--entry", $rel, $_.FullName)
          }
          Get-ChildItem "$bin\textures" -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
            $rel = $_.FullName.Substring($bin.Length + 1) -replace '\\', '/'
            $entries += @("--entry", $rel, $_.FullName)
          }
          Get-ChildItem "$bin\models" -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
            $rel = $_.FullName.Substring($bin.Length + 1) -replace '\\', '/'
            $entries += @("--entry", $rel, $_.FullName)
          }
          if (Test-Path "$bin\imgui.ini") {
            $entries += @("--entry", "imgui.ini", "$bin\imgui.ini")
          }
          Get-ChildItem "$env:RUNNER_TEMP\stage" -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring("$env:RUNNER_TEMP\stage".Length + 1) -replace '\\', '/'
            $entries += @("--entry", $rel, $_.FullName)
          }
          python Tools/embed_payload.py $exe @entries
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item $exe "ProjectTFG-windows.exe"
          Get-Item "ProjectTFG-windows.exe" | Select-Object Name, Length

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectTFG-windows.exe
          path: ProjectTFG-windows.exe

      - name: Adjuntar a Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ProjectTFG-windows.exe
          fail_on_unmatched_files: true

  memoria:
    name: Memoria (LaTeX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar TeX Live
        run: |
          set -ex
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-pictures texlive-bibtex-extra \
            texlive-lang-spanish biber

      - name: Compilar memoria (pdflatex + biber)
        working-directory: Memoria
        run: |
          set +e
          rm -f memoria.aux memoria.bcf memoria.bbl memoria.bbl-SAVE-ERROR memoria.run.xml memoria.log
          pdflatex -interaction=nonstopmode -halt-on-error memoria.tex > /tmp/tex1.log 2>&1
          r1=$?
          biber memoria > /tmp/biber.log 2>&1
          rb=$?
          pdflatex -interaction=nonstopmode -halt-on-error memoria.tex > /tmp/tex2.log 2>&1
          r2=$?
          pdflatex -interaction=nonstopmode -halt-on-error memoria.tex > /tmp/tex3.log 2>&1
          r3=$?
          cat /tmp/tex1.log /tmp/biber.log /tmp/tex2.log /tmp/tex3.log > /tmp/tex-all.log
          if [ "$r1" -ne 0 ] || [ "$rb" -ne 0 ] || [ "$r2" -ne 0 ] || [ "$r3" -ne 0 ]; then
            grep -nE "error:|Error|Fatal|!" /tmp/tex-all.log > /tmp/tex-err.log || tail -n 60 /tmp/tex-all.log > /tmp/tex-err.log
            tail -n 25 /tmp/tex-err.log | while IFS= read -r l; do echo "::error>MEM>$l"; done
            exit 1
          fi
          ls -la memoria.pdf

      - name: Subir log de Latex si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-memoria
          path: |
            /tmp/tex-all.log
            /tmp/biber.log

      - name: Subir PDF
        uses: actions/upload-artifact@v4
        with:
          name: memoria-pdf
          path: Memoria/memoria.pdf
          if-no-files-found: error

      - name: Adjuntar a Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Memoria/memoria.pdf
          fail_on_unmatched_files: false
