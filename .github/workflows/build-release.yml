name: Build multi-SO

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-debian:
    name: Linux (Debian/Ubuntu)
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: /tmp/vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de sistema
        run: |
          set -ex
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build glslang-tools \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxext-dev libwayland-dev wayland-protocols libxkbcommon-dev libxcb1-dev

      - name: Clonar y bootstrapar vcpkg
        run: |
          set -ex
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configurar (linux-release)
        run: |
          set +e
          cmake --preset linux-release 2>&1 | tee /tmp/config.log
          exit "${PIPESTATUS[0]}"

      - name: Compilar
        run: cmake --build --preset linux-release

      - name: Subir log de configuracion si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-linux-debian-config
          path: /tmp/config.log

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectTFG-linux-debian
          path: |
            out/build/linux-release/bin/ProjectTFG
            out/build/linux-release/bin/shaders
            out/build/linux-release/bin/textures
            out/build/linux-release/bin/models

      - name: Adjuntar a Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/build/linux-release/bin/ProjectTFG
            out/build/linux-release/bin/shaders
            out/build/linux-release/bin/textures
            out/build/linux-release/bin/models
          fail_on_unmatched_files: false

  linux-arch:
    name: Linux (Arch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      VCPKG_ROOT: /tmp/vcpkg
    steps:
      - name: Preparar herramientas base (git)
        run: |
          set -ex
          pacman -Sy --noconfirm
          pacman -S --noconfirm --needed git ca-certificates

      - uses: actions/checkout@v4

      - name: Dependencias de compilacion (Arch)
        run: |
          set +e
          pacman -Syu --noconfirm --needed \
            base-devel git cmake ninja glslang shaderc curl unzip tar xz \
            libx11 libxrandr libxinerama libxcursor libxi libxext \
            libwayland wayland-protocols libxkbcommon libxcb > /tmp/pacman.log 2>&1
          rc=$?
          tail -n 100 /tmp/pacman.log
          exit $rc

      - name: Subir log de pacman si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-linux-arch-pacman
          path: /tmp/pacman.log

      - name: Clonar y bootstrapar vcpkg
        run: |
          set -ex
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configurar (linux-release)
        run: |
          set +e
          cmake --preset linux-release 2>&1 | tee /tmp/config.log
          exit "${PIPESTATUS[0]}"

      - name: Compilar
        run: cmake --build --preset linux-release

      - name: Subir log de configuracion si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-linux-arch-config
          path: /tmp/config.log

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectTFG-linux-arch
          path: |
            out/build/linux-release/bin/ProjectTFG
            out/build/linux-release/bin/shaders
            out/build/linux-release/bin/textures
            out/build/linux-release/bin/models

      - name: Adjuntar a Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/build/linux-release/bin/ProjectTFG
            out/build/linux-release/bin/shaders
            out/build/linux-release/bin/textures
            out/build/linux-release/bin/models
          fail_on_unmatched_files: false

  windows:
    name: Windows
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vt\vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Vulkan SDK (glslang/glslc)
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdk = Get-ChildItem "C:\VulkanSDK" -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
          if ($sdk) { "$($sdk.FullName)\Bin" | Out-File -Append $env:GITHUB_PATH -Encoding UTF8 }
          else { Write-Error "VulkanSDK no encontrado tras instalar con choco" }

      - name: Clonar y bootstrapar vcpkg
        run: |
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_ROOT" | Out-Null
          git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configurar (win-release)
        run: |
          cmake --preset win-release 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\config.log"
          exit $LASTEXITCODE

      - name: Compilar
        run: cmake --build --preset win-release --config Release

      - name: Subir log de configuracion si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-windows-config
          path: ${{ runner.temp }}\config.log

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectTFG-windows
          path: |
            out/build/win-release/bin/ProjectTFG.exe
            out/build/win-release/bin/shaders
            out/build/win-release/bin/textures
            out/build/win-release/bin/models

      - name: Adjuntar a Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/build/win-release/bin/ProjectTFG.exe
            out/build/win-release/bin/shaders
            out/build/win-release/bin/textures
            out/build/win-release/bin/models
          fail_on_unmatched_files: false

  macos:
    name: macOS
    runs-on: macos-latest
    env:
      VCPKG_ROOT: /tmp/vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias (Homebrew)
        run: |
          set -ex
          brew install ninja glslang shaderc

      - name: Clonar y bootstrapar vcpkg
        run: |
          set -ex
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configurar (macos-release)
        run: cmake --preset macos-release

      - name: Compilar
        run: cmake --build --preset macos-release

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectTFG-macos
          path: |
            out/build/macos-release/bin/ProjectTFG
            out/build/macos-release/bin/shaders
            out/build/macos-release/bin/textures
            out/build/macos-release/bin/models

      - name: Adjuntar a Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/build/macos-release/bin/ProjectTFG
            out/build/macos-release/bin/shaders
            out/build/macos-release/bin/textures
            out/build/macos-release/bin/models
          fail_on_unmatched_files: false